<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Details Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script>
function validateForm() {
    const vtu = document.getElementById("vtu").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    // VTU should not be empty
    if (vtu === "") {
        alert("Please enter your VTU Number");
        return false;
    }
    // Simple email validation
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        alert("Please enter a valid Email address");
        return false;
    }

    // Phone number should be 10 digits
    const phonePattern = /^[0-9]{10}$/;
    if (!phonePattern.test(phone)) {
        alert("Please enter a valid 10-digit Phone Number");
        return false;
    }

    alert("Form submitted successfully!");
    return true;
}
</script>
</head>
<body>
<div class="p-4 m-5 border border-success">
<h2 class="text-center">Student Information Form</h2>
<form onsubmit="return validateForm()">
    <label>VTU Number:</label><br>
    <input type="text" id="vtu" placeholder="Enter VTU Number"><br><br>
    <label>Email ID:</label><br>
    <input type="text" id="email" placeholder="Enter Email"><br><br>
    <label>Phone Number:</label><br>
    <input type="text" id="phone" placeholder="Enter Phone Number"><br><br>
    <button type="submit" class="btn btn-success">Submit</button>
</form>
</div>
</body>
</html>
